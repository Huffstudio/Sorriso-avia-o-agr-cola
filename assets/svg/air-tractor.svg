<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 230" role="img" aria-label="Avião agrícola Air Tractor verde e amarelo">
  <style>
    .prop{transform-origin:584px 108px;animation:spin .09s linear infinite}
    @keyframes spin{0%{transform:scaleY(1)}50%{transform:scaleY(-1)}100%{transform:scaleY(1)}}
    @media (prefers-reduced-motion:reduce){.prop{animation:none}}
  </style>
  <defs>
    <linearGradient id="atBody" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFE14D"/><stop offset=".55" stop-color="#F5C400"/><stop offset="1" stop-color="#D9A800"/>
    </linearGradient>
    <linearGradient id="atGlass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#E9F7FF"/><stop offset="1" stop-color="#7FC4EA"/>
    </linearGradient>
    <linearGradient id="atGreen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#16A31F"/><stop offset="1" stop-color="#0B5E14"/>
    </linearGradient>
  </defs>
  <!-- estabilizador horizontal -->
  <path d="M22 104 L150 100 L152 110 L28 113 Z" fill="url(#atGreen)"/>
  <!-- deriva -->
  <path d="M70 102 L46 36 Q44 26 56 26 L86 28 Q94 29 98 36 L142 98 Z" fill="url(#atBody)" stroke="#0B5E14" stroke-width="2"/>
  <path d="M58 34 L84 35 L96 52 L66 52 Z" fill="url(#atGreen)"/>
  <!-- fuselagem -->
  <path d="M64 100 C170 92 280 80 330 78 L480 82 Q520 84 556 90 L560 126 Q520 132 480 134 C380 140 250 134 66 112 Z" fill="url(#atBody)" stroke="#8A6A00" stroke-width="1.5"/>
  <!-- capô turbina -->
  <path d="M470 82 L556 90 L560 126 L470 134 Z" fill="#FFE66B" opacity=".6"/>
  <!-- faixa verde -->
  <path d="M70 104 C190 100 300 98 420 100 L558 104 L559 114 L420 114 C300 116 190 114 72 108 Z" fill="url(#atGreen)"/>
  <path d="M470 82 L470 134" stroke="#8A6A00" stroke-width="1.5"/>
  <rect x="500" y="114" width="22" height="12" rx="3" fill="#3A3A3A"/>
  <rect x="503" y="117" width="16" height="6" rx="2" fill="#1C1C1C"/>
  <!-- cabine -->
  <path d="M318 80 Q326 44 360 40 L408 42 Q426 52 436 80 Z" fill="url(#atGlass)" stroke="#0B5E14" stroke-width="3"/>
  <path d="M372 41 L376 80 M404 42 L414 80" stroke="#0B5E14" stroke-width="2.5"/>
  <path d="M332 70 Q340 52 360 48" stroke="#fff" stroke-width="3" fill="none" opacity=".8" stroke-linecap="round"/>
  <!-- cortador de fio -->
  <path d="M420 42 L470 76" stroke="#3A3A3A" stroke-width="2.5"/>
  <!-- asa (perfil) -->
  <path d="M262 132 Q300 116 400 118 Q448 120 452 128 Q446 136 400 140 L262 140 Z" fill="url(#atGreen)" stroke="#084510" stroke-width="1.5"/>
  <path d="M290 122 Q340 116 420 120" stroke="#F5C400" stroke-width="3" fill="none"/>
  <!-- barra de pulverização -->
  <rect id="boom" x="258" y="142" width="48" height="5" rx="2.5" fill="#3A3A3A"/>
  <path d="M266 147 v7 M282 147 v7 M298 147 v7" stroke="#3A3A3A" stroke-width="3" stroke-linecap="round"/>
  <!-- trem de pouso -->
  <path d="M392 136 Q404 158 418 176" stroke="#2A2A2A" stroke-width="7" fill="none" stroke-linecap="round"/>
  <circle cx="420" cy="186" r="22" fill="#1E1E1E"/>
  <circle cx="420" cy="186" r="10" fill="#F5C400"/>
  <circle cx="420" cy="186" r="4" fill="#1E1E1E"/>
  <path d="M84 110 L74 128" stroke="#2A2A2A" stroke-width="4" stroke-linecap="round"/>
  <circle cx="72" cy="132" r="7" fill="#1E1E1E"/>
  <!-- spinner e hélice -->
  <path d="M556 90 Q590 104 586 108 Q590 112 558 126 Z" fill="url(#atGreen)" stroke="#084510" stroke-width="1.5"/>
  <ellipse cx="584" cy="108" rx="5" ry="78" fill="#9BB5A0" opacity=".25"/>
  <g class="prop"><path d="M581 108 L578 34 Q584 28 588 34 L587 108 Z" fill="#2A2A2A"/><path d="M579 36 L588 36 L588 46 L578 46 Z" fill="#F5C400"/></g>
  <!-- matrícula -->
  <text x="190" y="128" font-family="Arial, sans-serif" font-weight="700" font-size="13" fill="#0B5E14" letter-spacing="1">PR-SRS</text>
</svg>
